name: Release

# Push a tag like v0.1.0 to build the installer and publish a GitHub release.
# Run it by hand (workflow_dispatch) to build the installer as a test artifact only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match app version $v" }
          if (-not (Test-Path "docs/release-notes/v$v.md")) { throw "Missing docs/release-notes/v$v.md" }
      - name: Fetch restic (pinned, hash-checked)
        shell: pwsh
        run: ./scripts/fetch-restic.ps1
      - name: Tests
        run: cargo test --workspace
      - name: Build service
        run: cargo build --release -p lifeboat-svc
      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles nsis --config src-tauri/tauri.release.json
      - name: Collect files and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe out/
          Push-Location out
          Get-ChildItem -File | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: lifeboat-installer
          path: out/
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag (Get-ChildItem out -File).FullName --prerelease --title "Lifeboat $tag" --notes-file "docs/release-notes/$tag.md"
