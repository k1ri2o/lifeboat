[workspace]
resolver = "2"
members = [
    "crates/lifeboat-core",
    "crates/lifeboat-detect",
    "crates/lifeboat-disk",
    "crates/lifeboat-engine",
    "crates/lifeboat-svc",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"
authors = ["Lifeboat contributors"]
repository = "https://github.com/k1ri2o/lifeboat"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lifeboat-core = { path = "crates/lifeboat-core" }
